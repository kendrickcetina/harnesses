[project]
name = "harnesses"
version = "0.1.0"
description = "Agent harnesses tutorial: DeepSeek Harness, Codex and Claude Code driven by a local Qwen model. Modelos Generativos Profundos (MIA, ICAI)."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Kendrick Cetina" }]
dependencies = [
    # Local model server (the "LLM call" layer)
    "torch>=2.8,<2.15",
    "transformers>=5.3,<6",
    "accelerate>=1.5",
    "safetensors>=0.5",
    "huggingface-hub>=1.0",
    "peft>=0.18",
    "pillow>=11",
    "torchvision>=0.23",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "sse-starlette>=2.2",
    "httpx>=0.28",
    "pydantic>=2.11",
    "pyyaml>=6.0",
    "datasets>=3.0",
    "rich>=13.9",
    # Harnesses and tools
    "deepseek-harness-sdk==0.2.1rc2",
    "mcp>=1.20",
    "openai>=1.80",
    "python-docx>=1.2",
    # Notebook
    "jupyterlab>=4.3",
    "ipykernel>=6.29",
    "ipywidgets>=8.1",
    "nbclient>=0.10",
    "nbformat>=5.10",
]

[project.optional-dependencies]
# Faster Gated DeltaNet kernels for Qwen3.5 on Linux + CUDA (Triton). Optional.
fast = ["flash-linear-attention>=0.4 ; sys_platform == 'linux'"]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.11"]

[project.scripts]
harness-download = "harness_lab.download:main"
harness-serve = "harness_lab.server.app:main"
harness-mcp = "harness_lab.tools.mcp_server:main"
harness-dsh = "harness_lab.dsh:main"
harness-wsp = "harness_lab.wsp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harness_lab"]

[tool.uv]
default-groups = ["dev"]

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = [".codex_home", ".claude_home", "workspace", "outputs", "*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
